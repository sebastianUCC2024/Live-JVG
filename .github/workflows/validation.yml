name: Validate services and clients

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 17 / ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [live-feed-producer, match-state-service, dashboard-backend]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/**/pom.xml
      # Each real service lifecycle runs tests and Spring Boot repackage in a fresh checkout.
      # External integrations are excluded by JUnit tags in the service POMs.
      - name: Compile, test and package the service
        run: mvn -B -ntp -f services/${{ matrix.service }}/pom.xml verify

  react:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/dashboard-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/dashboard-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Static dashboard scripts
        run: node --test services/dashboard-backend/src/test/js/*.test.cjs
