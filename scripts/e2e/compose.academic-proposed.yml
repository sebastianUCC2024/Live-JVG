# PROPOSED ON overlay: separate execution approval required. Never use for PASSIVE/OFF.
services:
  producer:
    environment:
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_SQL_INIT_MODE: "never"
      SPRING_RABBITMQ_DYNAMIC: "false"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      SIMULATOR_WRITE_ENABLED: "true"
  match-state:
    environment:
      RABBITMQ_USERNAME: ${E2E_SCORE_PUBLISHER_USERNAME:?Dedicated scoped Rabbit identity required}
      RABBITMQ_PASSWORD: ${E2E_SCORE_PUBLISHER_PASSWORD:?Dedicated scoped Rabbit identity required}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_SQL_INIT_MODE: "never"
      SPRING_RABBITMQ_DYNAMIC: "false"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      MATCH_STATE_ALERTS_ENABLED: "true"
      MATCH_STATE_ALERTS_PUBLICATION_ENABLED: "true"
      MATCH_STATE_CATALOG_BOOTSTRAP_ENABLED: "false"
      MATCH_STATE_RECOVERY_ENABLED: "true"
      MATCH_STATE_PUBLICATION_ENABLED: "true"
      KAFKA_LISTENER_AUTO_STARTUP: "true"
  dashboard:
    environment:
      DASHBOARD_ALLOWED_ORIGINS: "http://127.0.0.1:15173"
      RABBITMQ_USERNAME: ${E2E_SCORE_READER_USERNAME:?Dedicated scoped Rabbit identity required}
      RABBITMQ_PASSWORD: ${E2E_SCORE_READER_PASSWORD:?Dedicated scoped Rabbit identity required}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_SQL_INIT_MODE: "never"
      SPRING_RABBITMQ_DYNAMIC: "false"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "true"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      SPRING_PROFILES_ACTIVE: "passive"
      DASHBOARD_CATALOG_BOOTSTRAP_ENABLED: "false"
      SIMULATOR_WRITE_ENABLED: "false"
      DASHBOARD_RABBIT_LISTENER_ENABLED: "true"
      DASHBOARD_SCORE_SEQUENCE_REQUIRED: "true"
  notification:
    ports: !override ["127.0.0.1:18192:8082"]
    environment:
      NOTIFICATION_ALLOWED_ORIGINS: "http://127.0.0.1:15173"
      NOTIFICATION_RABBIT_USERNAME: ${E2E_ALERT_READER_USERNAME:?Dedicated scoped Rabbit identity required}
      NOTIFICATION_RABBIT_PASSWORD: ${E2E_ALERT_READER_PASSWORD:?Dedicated scoped Rabbit identity required}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_SQL_INIT_MODE: "never"
      SPRING_RABBITMQ_DYNAMIC: "false"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "true"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      NOTIFICATION_LIVE_ALERTS_ENABLED: "true"
      NOTIFICATION_STORAGE_ENABLED: "true"
      NOTIFICATION_MESSAGING_ENABLED: "true"
      NOTIFICATION_QUEUE: ${E2E_NOTIFICATION_ALERT_QUEUE:?Dedicated fanout queue required}
  archiver:
    environment:
      RABBITMQ_USERNAME: "unused-no-rabbit-access"
      RABBITMQ_PASSWORD: ""
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_SQL_INIT_MODE: "never"
      SPRING_RABBITMQ_DYNAMIC: "false"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      ARCHIVER_CONSUMER_ENABLED: "true"
  suspension:
    environment:
      RABBITMQ_USERNAME: ${E2E_ACADEMIC_PUBLISHER_USERNAME:?Dedicated scoped Rabbit identity required}
      RABBITMQ_PASSWORD: ${E2E_ACADEMIC_PUBLISHER_PASSWORD:?Dedicated scoped Rabbit identity required}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_SQL_INIT_MODE: "never"
      SPRING_RABBITMQ_DYNAMIC: "false"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      ACADEMIC_COMMANDS_ENABLED: "true"
      ACADEMIC_PUBLICATION_ENABLED: "true"
      BETTING_CONTROL_CONSUMER_ENABLED: "true"
      BETTING_CONTROL_PUBLICATION_ENABLED: "false"
      ACADEMIC_QUEUE: "betting_commands"
      SPRING_RABBITMQ_VIRTUAL_HOST: ${E2E_ACADEMIC_VHOST:?Separate academic vhost required}
  worker:
    environment:
      RABBITMQ_USERNAME: ${E2E_ACADEMIC_WORKER_USERNAME:?Dedicated scoped Rabbit identity required}
      RABBITMQ_PASSWORD: ${E2E_ACADEMIC_WORKER_PASSWORD:?Dedicated scoped Rabbit identity required}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_SQL_INIT_MODE: "never"
      SPRING_RABBITMQ_DYNAMIC: "false"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      ACADEMIC_CONSUMER_ENABLED: "true"
      ACADEMIC_TOPOLOGY_ENABLED: "false"
      BETTING_WORKER_CONSUMER_ENABLED: "false"
      BETTING_WORKER_ACCEPTANCE_ENABLED: "false"
      BETTING_WORKER_AUTHORIZATION_MODE: "disabled"
      ACADEMIC_QUEUE: "betting_commands"
      SPRING_RABBITMQ_VIRTUAL_HOST: ${E2E_ACADEMIC_VHOST:?Separate academic vhost required}
