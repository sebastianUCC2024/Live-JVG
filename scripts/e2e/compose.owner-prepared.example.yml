# Copy to tmp/e2e-owner.yml, review with Gabriel/Valeria, then fill ONLY for a new project.
# This example keeps adapters OFF. It is not an operational activation approval.
# Requires Compose support for !reset (validated by config before any up).
services:
  dashboard:
    container_name: !reset null
    environment:
      MATCH_ID: ${E2E_MATCH_ID:?Set run-specific match}
  producer:
    environment:
      MATCH_ID: ${E2E_MATCH_ID}
  match-state:
    environment:
      MATCH_ID: ${E2E_MATCH_ID}
  archiver:
    environment:
      ARCHIVER_CONSUMER_ENABLED: "false"
      ARCHIVER_DB_USERNAME: ${E2E_ARCHIVER_ROLE:?Owner must provision a dedicated role}
      ARCHIVER_DB_PASSWORD: ${E2E_ARCHIVER_PASSWORD:?Owner secret required}
  suspension:
    environment:
      BETTING_CONTROL_CONSUMER_ENABLED: "false"
      BETTING_CONTROL_DB_USERNAME: ${E2E_CONTROL_ROLE:?Owner role required}
      BETTING_CONTROL_DB_PASSWORD: ${E2E_CONTROL_PASSWORD:?Owner secret required}
  worker:
    environment:
      BETTING_WORKER_CONSUMER_ENABLED: "false"
      BETTING_WORKER_DB_USERNAME: ${E2E_WORKER_ROLE:?Owner role required}
      BETTING_WORKER_DB_PASSWORD: ${E2E_WORKER_PASSWORD:?Owner secret required}
      BETTING_WORKER_EXCHANGE: ${E2E_COMMAND_EXCHANGE:?Approved isolated exchange}
      BETTING_WORKER_QUEUE: ${E2E_COMMAND_QUEUE:?Approved isolated queue}
      BETTING_WORKER_ACCEPTANCE_ENABLED: "false"
      BETTING_WORKER_AUTHORIZATION_MODE: disabled
  notification:
    environment:
      NOTIFICATION_STORAGE_ENABLED: "false"
      NOTIFICATION_MESSAGING_ENABLED: "false"
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/live_jvg
      NOTIFICATION_DB_USERNAME: ${E2E_NOTIFICATION_ROLE:?Owner role required}
      NOTIFICATION_DB_PASSWORD: ${E2E_NOTIFICATION_PASSWORD:?Owner secret required}
      NOTIFICATION_MATCH_IDS: ${E2E_MATCH_ID}
      NOTIFICATION_RABBIT_HOST: rabbitmq
      NOTIFICATION_RABBIT_PORT: "5672"
      NOTIFICATION_RABBIT_USERNAME: mvp
      NOTIFICATION_RABBIT_PASSWORD: ${MVP_RABBIT_PASSWORD}
