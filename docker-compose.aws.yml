services:
  postgres:
    image: postgres:17
    environment:
      PGHOST: live-jvg-postgres.c03ye40kiikw.us-east-1.rds.amazonaws.com
      PGPORT: "5432"
      PGDATABASE: live_jvg
      PGUSER: live_jvg
      PGPASSWORD: ${MVP_DB_PASSWORD}
      PGSSLMODE: require
    entrypoint: ["sh", "-c"]
    command:
      - 'while true; do sleep 3600; done'
    ports: !reset []
    volumes: !reset []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h \"$${PGHOST}\" -p 5432 -U \"$${PGUSER}\" -d \"$${PGDATABASE}\""]
      interval: 10s
      timeout: 5s
      retries: 15

  dashboard:
    environment:
      DASHBOARD_DB_URL: jdbc:postgresql://live-jvg-postgres.c03ye40kiikw.us-east-1.rds.amazonaws.com:5432/live_jvg?sslmode=require
      DASHBOARD_ALLOWED_ORIGINS: https://livejvg.duckdns.org

  match-state:
    environment:
      MATCH_STATE_DB_URL: jdbc:postgresql://live-jvg-postgres.c03ye40kiikw.us-east-1.rds.amazonaws.com:5432/live_jvg?sslmode=require
      MATCH_STATE_ALERTS_ENABLED: "true"
      MATCH_STATE_ALERTS_PUBLICATION_ENABLED: "true"
      MATCHSTATE_MATCHES_0_MATCHID: "mvp-match-001"
      MATCHSTATE_MATCHES_0_HOMETEAMID: "home"
      MATCHSTATE_MATCHES_0_AWAYTEAMID: "away"
      MATCHSTATE_MATCHES_1_MATCHID: "demo-col-v4-001"
      MATCHSTATE_MATCHES_1_HOMETEAMID: "nacional"
      MATCHSTATE_MATCHES_1_AWAYTEAMID: "millonarios"
      MATCHSTATE_MATCHES_2_MATCHID: "demo-col-v4-002"
      MATCHSTATE_MATCHES_2_HOMETEAMID: "america"
      MATCHSTATE_MATCHES_2_AWAYTEAMID: "cali"
      MATCHSTATE_MATCHES_3_MATCHID: "demo-col-v4-003"
      MATCHSTATE_MATCHES_3_HOMETEAMID: "junior"
      MATCHSTATE_MATCHES_3_AWAYTEAMID: "medellin"
      MATCHSTATE_MATCHES_4_MATCHID: "demo-col-v4-004"
      MATCHSTATE_MATCHES_4_HOMETEAMID: "santafe"
      MATCHSTATE_MATCHES_4_AWAYTEAMID: "tolima"
      MATCHSTATE_MATCHES_5_MATCHID: "demo-col-v4-005"
      MATCHSTATE_MATCHES_5_HOMETEAMID: "oncecaldas"
      MATCHSTATE_MATCHES_5_AWAYTEAMID: "pereira"
      MATCHSTATE_MATCHES_6_MATCHID: "demo-col-v4-006"
      MATCHSTATE_MATCHES_6_HOMETEAMID: "bucaramanga"
      MATCHSTATE_MATCHES_6_AWAYTEAMID: "fortaleza"

  archiver:
    environment:
      ARCHIVER_DB_URL: jdbc:postgresql://live-jvg-postgres.c03ye40kiikw.us-east-1.rds.amazonaws.com:5432/live_jvg?sslmode=require

  suspension:
    environment:
      BETTING_CONTROL_DB_URL: jdbc:postgresql://live-jvg-postgres.c03ye40kiikw.us-east-1.rds.amazonaws.com:5432/live_jvg?sslmode=require

  worker:
    environment:
      BETTING_WORKER_DB_URL: jdbc:postgresql://live-jvg-postgres.c03ye40kiikw.us-east-1.rds.amazonaws.com:5432/live_jvg?sslmode=require


  producer:
    environment:
      SIMULATOR_AUTO_ENABLED: "true"
      SIMULATOR_AUTO_INTERVAL_MS: "1000"

  notification:
    ports:
      - "127.0.0.1:18082:8082"
    environment:
      NOTIFICATION_STORAGE_ENABLED: "true"
      NOTIFICATION_DB_URL: jdbc:postgresql://live-jvg-postgres.c03ye40kiikw.us-east-1.rds.amazonaws.com:5432/live_jvg?sslmode=require
      NOTIFICATION_DB_USERNAME: live_jvg
      NOTIFICATION_DB_PASSWORD: ${MVP_DB_PASSWORD}
      NOTIFICATION_MESSAGING_ENABLED: "true"
      NOTIFICATION_RABBIT_HOST: rabbitmq
      NOTIFICATION_RABBIT_PORT: "5672"
      NOTIFICATION_RABBIT_USERNAME: mvp
      NOTIFICATION_RABBIT_PASSWORD: ${MVP_RABBIT_PASSWORD}
      NOTIFICATION_LIVE_ALERTS_ENABLED: "true"
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "true"
      NOTIFICATION_MATCH_IDS: "demo-col-v4-001,demo-col-v4-002,demo-col-v4-003,demo-col-v4-004,demo-col-v4-005,demo-col-v4-006"