name: ${AUDIT_PROJECT:?Use phase9f.py prepare}

x-labels: &labels
  live-jvg.audit.run: ${AUDIT_RUN_ID:?Required isolated run}
  live-jvg.audit.purpose: phase9f
x-rabbit: &rabbit
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: ${TEST_RABBIT_USERNAME:?Required test user}
  RABBITMQ_PASSWORD: ${TEST_RABBIT_PASSWORD:?Required test password}
  SPRING_RABBITMQ_VIRTUAL_HOST: ${TEST_RABBIT_VHOST:?Required test vhost}
  RABBITMQ_EXCHANGE: ${AUDIT_EXCHANGE:?Required test exchange}
x-match: &match
  MATCH_ID: ${AUDIT_MATCH_ID:?Required test match}
  HOME_TEAM_ID: home
  AWAY_TEAM_ID: away
  MATCH_EVENTS_TOPIC: ${AUDIT_TOPIC:?Required test topic}

services:
  postgres:
    build: {context: ./postgres}
    image: ${AUDIT_PROJECT}-postgres:17
    container_name: ${AUDIT_PROJECT}-postgres
    labels: *labels
    environment:
      AUDIT_RUN_ID: ${AUDIT_RUN_ID}
      POSTGRES_DB: live_jvg_test_${AUDIT_RUN_ID}_e2e
      POSTGRES_USER: ${MATCH_STATE_TEST_DB_USERNAME:?Required test DB user}
      POSTGRES_PASSWORD: ${MATCH_STATE_TEST_DB_PASSWORD:?Required test DB password}
    ports: ["127.0.0.1:${AUDIT_POSTGRES_PORT:?Required test port}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  kafka:
    image: apache/kafka:3.9.1
    labels: *labels
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${AUDIT_KAFKA_PORT:?Required test port}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${AUDIT_KAFKA_CLUSTER_ID:?Required fresh cluster ID}
    ports: ["127.0.0.1:${AUDIT_KAFKA_PORT}:19092"]
    volumes: ["kafkadata:/var/lib/kafka/data"]
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 1024m

  kafka-init:
    image: apache/kafka:3.9.1
    labels: *labels
    depends_on: {kafka: {condition: service_healthy}}
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, "kafka:9092", --create, --if-not-exists, --topic, "${AUDIT_TOPIC}", --partitions, "1", --replication-factor, "1"]
    networks: [isolated]

  rabbitmq:
    image: rabbitmq:4-management
    labels: *labels
    environment:
      RABBITMQ_DEFAULT_USER: ${TEST_RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${TEST_RABBIT_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${TEST_RABBIT_VHOST}
    ports: ["127.0.0.1:${TEST_RABBIT_PORT:?Required test port}:5672", "127.0.0.1:${AUDIT_RABBIT_MANAGEMENT_PORT:?Required test port}:15672"]
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    networks: [isolated]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  producer:
    profiles: [apps]
    labels: *labels
    build:
      context: ../..
      args: {JAR_FILE: "${AUDIT_PRODUCER_JAR:?Required isolated executable JAR}"}
    environment:
      <<: *match
      PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SIMULATOR_WRITE_ENABLED: "true"
    ports: ["127.0.0.1:${AUDIT_PRODUCER_PORT:?Required test port}:8080"]
    networks: [isolated]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    mem_limit: 384m

  dashboard:
    profiles: [apps]
    container_name: ${AUDIT_PROJECT}-dashboard
    deploy: {replicas: 1}
    labels: *labels
    build:
      context: ../..
      args: {JAR_FILE: "${AUDIT_DASHBOARD_JAR:?Required isolated executable JAR}"}
    environment:
      <<: [*match, *rabbit]
      PORT: "8080"
      DASHBOARD_DB_URL: jdbc:postgresql://postgres:5432/live_jvg_test_${AUDIT_RUN_ID}_e2e
      DB_USERNAME: ${DASHBOARD_TEST_DB_USERNAME:?Required test DB user}
      DB_PASSWORD: ${DASHBOARD_TEST_DB_PASSWORD:?Required test DB password}
      DASHBOARD_QUEUE: ${AUDIT_QUEUE:?Required test queue}
      DASHBOARD_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      PRODUCER_URL: http://producer:8080
      SIMULATOR_WRITE_ENABLED: "true"
    ports: ["127.0.0.1:${AUDIT_DASHBOARD_PORT:?Required test port}:8080"]
    networks: [isolated]
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    mem_limit: 512m

  match-state:
    profiles: [apps]
    labels: *labels
    build:
      context: ../..
      args: {JAR_FILE: "${AUDIT_STATE_JAR:?Required isolated executable JAR}"}
    environment:
      <<: [*match, *rabbit]
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MATCH_STATE_DB_URL: jdbc:postgresql://postgres:5432/live_jvg_test_${AUDIT_RUN_ID}_e2e
      MATCH_STATE_DB_USERNAME: ${MATCH_STATE_TEST_DB_USERNAME}
      MATCH_STATE_DB_PASSWORD: ${MATCH_STATE_TEST_DB_PASSWORD}
      KAFKA_SOURCE_ID: ${AUDIT_PROJECT}
    networks: [isolated]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    mem_limit: 512m

networks:
  isolated:
    internal: true
    labels: *labels
volumes:
  pgdata: {labels: *labels}
  kafkadata: {labels: *labels}
  rabbitdata: {labels: *labels}
