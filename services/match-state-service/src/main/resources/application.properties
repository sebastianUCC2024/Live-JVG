spring.application.name=match-state-service
match-state.storage=postgres
spring.datasource.url=${MATCH_STATE_DB_URL:jdbc:postgresql://localhost:5432/match_state}
spring.datasource.username=${MATCH_STATE_DB_USERNAME:match_state}
spring.datasource.password=${MATCH_STATE_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.default-schema=match_state
spring.flyway.schemas=match_state
spring.flyway.clean-disabled=true
match-state.recovery.retry-interval=5s
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=match-state-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
match-state.kafka.source-id=${KAFKA_SOURCE_ID:local/1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.listener.ack-mode=record
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}
match-state.kafka.topic=${MATCH_EVENTS_TOPIC:match_events}
match-state.kafka.retry-interval=1s
match-state.kafka.retry-cooldown=30s
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.retry.enabled=false
match-state.rabbit.exchange=${RABBITMQ_EXCHANGE:live_updates}
match-state.rabbit.routing-key=score.{matchId}
match-state.rabbit.confirm-timeout=5s
# Match registration is explicit; no team identity is inferred from a goal.
match-state.matches[0].match-id=${MATCH_ID:}
match-state.matches[0].home-team-id=${HOME_TEAM_ID:}
match-state.matches[0].away-team-id=${AWAY_TEAM_ID:}

# Safe listener/retry logs are emitted by our adapters without record payloads.
logging.level.org.springframework.kafka.listener=OFF

# Independent startup controls; normal operation remains enabled by default.
match-state.catalog.bootstrap-enabled=${MATCH_STATE_CATALOG_BOOTSTRAP_ENABLED:true}
match-state.recovery.enabled=${MATCH_STATE_RECOVERY_ENABLED:true}
match-state.publication.enabled=${MATCH_STATE_PUBLICATION_ENABLED:true}

# New durable destination: explicit opt-in, independent from ScoreUpdate delivery.
match-state.alerts.enabled=${MATCH_STATE_ALERTS_ENABLED:false}
match-state.alerts.publication-enabled=${MATCH_STATE_ALERTS_PUBLICATION_ENABLED:false}
