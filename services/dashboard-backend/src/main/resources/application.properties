spring.application.name=dashboard-backend
server.port=${DASHBOARD_PORT:${PORT:8080}}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=${DASHBOARD_DB_URL:jdbc:postgresql://localhost:55434/live_jvg}
spring.datasource.username=${DB_USERNAME:live_jvg}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.schemas=dashboard
spring.flyway.default-schema=dashboard
spring.flyway.clean-disabled=true
dashboard.catalog.bootstrap-enabled=${DASHBOARD_CATALOG_BOOTSTRAP_ENABLED:true}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.auto-startup=${DASHBOARD_RABBIT_LISTENER_ENABLED:true}
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
live.retry.max-attempts=3
live.retry.interval-ms=1000
live.retry.confirm-timeout=5s
producer.url=${PRODUCER_URL:http://localhost:18081}
producer.connect-timeout=${PRODUCER_CONNECT_TIMEOUT:2s}
producer.read-timeout=${PRODUCER_READ_TIMEOUT:5s}
live.exchange=${RABBITMQ_EXCHANGE:live_updates}
live.queue=${DASHBOARD_QUEUE:mvp-dashboard-scores}
live.match-id=${MATCH_ID:mvp-match-001}
live.home-team-id=${HOME_TEAM_ID:home}
live.away-team-id=${AWAY_TEAM_ID:away}
live.home-name=${HOME_TEAM_NAME:Atl\u00e9tico Local}
live.away-name=${AWAY_TEAM_NAME:Deportivo Visitante}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
simulator.write-enabled=${SIMULATOR_WRITE_ENABLED:false}
