# Durable read-only startup: schema and catalog must already be provisioned.
# This profile does not grant permission to start or provision infrastructure.
dashboard.catalog.bootstrap-enabled=false
simulator.write-enabled=false
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.rabbitmq.dynamic=false
management.health.rabbit.enabled=false
