# Perfil opcional con conexiones aisladas, sin activación automática de procesos.
server.port=${DEV3_CONTROL_HTTP_PORT:18883}
spring.datasource.url=${DEV3_CONTROL_DB_URL}
spring.datasource.username=${DEV3_CONTROL_DB_USERNAME}
spring.datasource.password=${DEV3_CONTROL_DB_PASSWORD}
spring.flyway.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,messagingReadiness,marketOutbox
management.endpoint.health.show-details=never
spring.kafka.bootstrap-servers=${DEV3_KAFKA_BOOTSTRAP_SERVERS}
betting.kafka.topic=${DEV3_MATCH_EVENTS_TOPIC}
betting.kafka.group-id=${DEV3_CONTROL_GROUP_ID}
betting.source-id=${DEV3_CONTROL_SOURCE_ID}
betting.consumer.enabled=false
spring.kafka.listener.auto-startup=false
spring.rabbitmq.host=${DEV3_RABBITMQ_HOST}
spring.rabbitmq.port=${DEV3_RABBITMQ_PORT}
spring.rabbitmq.username=${DEV3_RABBITMQ_USERNAME}
spring.rabbitmq.password=${DEV3_RABBITMQ_PASSWORD}
spring.rabbitmq.dynamic=false
betting.publication.enabled=false

# Utiliza un vhost aislado; este perfil no declara la topología.
spring.rabbitmq.virtual-host=${DEV3_RABBITMQ_VHOST}
betting.publication.exchange=${DEV3_CONTROL_EXCHANGE:}
betting.publication.routing-key=${DEV3_CONTROL_ROUTING_KEY:}
