spring.application.name=betting-suspension-service
server.port=${BETTING_CONTROL_PORT:8083}
spring.datasource.url=${BETTING_CONTROL_DB_URL:jdbc:postgresql://localhost:5432/betting_control}
spring.datasource.username=${BETTING_CONTROL_DB_USERNAME:betting_control}
spring.datasource.password=${BETTING_CONTROL_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=false
spring.flyway.schemas=betting_control
spring.flyway.default-schema=betting_control
spring.flyway.clean-disabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=false
betting.consumer.enabled=${BETTING_CONTROL_CONSUMER_ENABLED:false}
betting.kafka.topic=${MATCH_EVENTS_TOPIC:match_events}
betting.kafka.group-id=${BETTING_CONTROL_GROUP_ID:betting-suspension-service}
betting.source-id=${BETTING_CONTROL_SOURCE_ID:local/1}
betting.retry-interval-ms=200
betting.publication.enabled=${BETTING_CONTROL_PUBLICATION_ENABLED:false}
betting.publication.exchange=${BETTING_CONTROL_EXCHANGE:}
betting.publication.routing-key=${BETTING_CONTROL_ROUTING_KEY:}
betting.publication.confirm-timeout-ms=5000
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.dynamic=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
management.health.rabbit.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.property-naming-strategy=SNAKE_CASE
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework.kafka.listener=OFF

management.endpoint.health.probes.enabled=true

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,messagingReadiness,marketOutbox
