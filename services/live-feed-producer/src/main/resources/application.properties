spring.application.name=live-feed-producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
live-feed.kafka.topic=${MATCH_EVENTS_TOPIC:match_events}

spring.jackson.property-naming-strategy=SNAKE_CASE
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
simulator.write-enabled=${SIMULATOR_WRITE_ENABLED:false}

# Reject duplicate JSON properties, including contradictory repeated VAR references.
spring.jackson.parser.strict-duplicate-detection=true

# Registered simulator matches
simulator.matches[0].match-id=${MATCH_ID:mvp-match-001}
simulator.matches[0].home-team-id=${HOME_TEAM_ID:home}
simulator.matches[0].away-team-id=${AWAY_TEAM_ID:away}

