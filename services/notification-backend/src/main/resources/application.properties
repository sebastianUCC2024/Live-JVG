spring.application.name=notification-backend
server.address=${NOTIFICATION_BIND_ADDRESS:127.0.0.1}
server.port=${NOTIFICATION_PORT:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Crea el DataSource solo al habilitar notification.storage.enabled.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
notification.storage.enabled=${NOTIFICATION_STORAGE_ENABLED:false}
notification.storage.url=${NOTIFICATION_DB_URL:}
notification.storage.username=${NOTIFICATION_DB_USERNAME:}
notification.storage.password=${NOTIFICATION_DB_PASSWORD:}
spring.sql.init.mode=never
# V1 requiere el esquema preparado; las migraciones automáticas están desactivadas.
spring.flyway.enabled=false
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
notification.messaging.enabled=${NOTIFICATION_MESSAGING_ENABLED:false}
notification.messaging.exchange=${NOTIFICATION_EXCHANGE:live_updates}
notification.messaging.queue=${NOTIFICATION_QUEUE:notification.score-updates}
notification.messaging.match-ids=${NOTIFICATION_MATCH_IDS:}
notification.messaging.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
notification.messaging.retry-interval-ms=${NOTIFICATION_RETRY_INTERVAL_MS:1000}
notification.messaging.confirm-timeout=${NOTIFICATION_CONFIRM_TIMEOUT:5s}
spring.rabbitmq.host=${NOTIFICATION_RABBIT_HOST:localhost}
spring.rabbitmq.port=${NOTIFICATION_RABBIT_PORT:5673}
spring.rabbitmq.username=${NOTIFICATION_RABBIT_USERNAME:}
spring.rabbitmq.password=${NOTIFICATION_RABBIT_PASSWORD:}
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=${NOTIFICATION_MESSAGING_ENABLED:false}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=5s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.rabbit.enabled=${NOTIFICATION_MESSAGING_ENABLED:false}
notification.web.allowed-origins=${NOTIFICATION_ALLOWED_ORIGINS:}
# La actividad del proceso no demuestra disponibilidad del consumidor persistente.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,notificationReadiness
management.endpoint.health.group.readiness.show-details=always

notification.messaging.live-alerts-enabled=${NOTIFICATION_LIVE_ALERTS_ENABLED:false}
