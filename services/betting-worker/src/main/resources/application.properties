spring.application.name=betting-worker
server.port=${BETTING_WORKER_PORT:8084}
spring.datasource.url=${BETTING_WORKER_DB_URL:jdbc:postgresql://localhost:5432/betting_worker}
spring.datasource.username=${BETTING_WORKER_DB_USERNAME:betting_worker}
spring.datasource.password=${BETTING_WORKER_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=false
spring.flyway.schemas=betting_worker
spring.flyway.default-schema=betting_worker
spring.flyway.clean-disabled=true
worker.consumer.enabled=${BETTING_WORKER_CONSUMER_ENABLED:false}
worker.acceptance.enabled=${BETTING_WORKER_ACCEPTANCE_ENABLED:false}
worker.evidence.max-age=5s
worker.command.max-age=5m
worker.rabbit.exchange=${BETTING_WORKER_EXCHANGE:}
worker.rabbit.queue=${BETTING_WORKER_QUEUE:}
worker.rabbit.source-id=${BETTING_WORKER_SOURCE_ID:local/1}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
management.health.rabbit.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.property-naming-strategy=SNAKE_CASE
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework.amqp.rabbit.listener=OFF

management.endpoint.health.probes.enabled=true

worker.authorization.mode=${BETTING_WORKER_AUTHORIZATION_MODE:disabled}
worker.authorization.expected-database=${BETTING_WORKER_AUTHORITY_DATABASE:}
worker.authorization.expected-epoch=${BETTING_WORKER_AUTHORITY_EPOCH:}

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,messagingReadiness
