# Opt-in profile: explicit isolated connections, no automatic activation of side effects.
server.port=${DEV3_WORKER_HTTP_PORT:18884}
spring.datasource.url=${DEV3_WORKER_DB_URL}
spring.datasource.username=${DEV3_WORKER_DB_USERNAME}
spring.datasource.password=${DEV3_WORKER_DB_PASSWORD}
spring.flyway.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,messagingReadiness
management.endpoint.health.show-details=never
spring.rabbitmq.host=${DEV3_RABBITMQ_HOST}
spring.rabbitmq.port=${DEV3_RABBITMQ_PORT}
spring.rabbitmq.username=${DEV3_RABBITMQ_USERNAME}
spring.rabbitmq.password=${DEV3_RABBITMQ_PASSWORD}
spring.rabbitmq.dynamic=false
worker.consumer.enabled=false
worker.acceptance.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false

worker.authorization.mode=disabled

# Explicit isolated vhost; no topology is declared by this profile.
spring.rabbitmq.virtual-host=${DEV3_RABBITMQ_VHOST}
worker.rabbit.exchange=${DEV3_WORKER_EXCHANGE:}
worker.rabbit.queue=${DEV3_WORKER_QUEUE:}
