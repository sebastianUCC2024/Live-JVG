# Se selecciona después de dev3-integration; usa la misma base con usuarios y esquemas separados.
spring.datasource.url=${DEV3_AUTHORITY_DB_URL}
spring.datasource.username=${DEV3_WORKER_DB_USERNAME}
spring.datasource.password=${DEV3_WORKER_DB_PASSWORD}
spring.flyway.enabled=false
worker.consumer.enabled=false
worker.acceptance.enabled=false
worker.authorization.mode=disabled
# Seleccionar el perfil no activa migraciones, leases ni consumidores.
