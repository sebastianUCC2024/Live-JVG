# Perfil opcional con conexiones aisladas, sin activación automática de procesos.
server.port=${DEV3_ARCHIVER_HTTP_PORT:18882}
spring.datasource.url=${DEV3_ARCHIVER_DB_URL}
spring.datasource.username=${DEV3_ARCHIVER_DB_USERNAME}
spring.datasource.password=${DEV3_ARCHIVER_DB_PASSWORD}
spring.flyway.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,messagingReadiness
management.endpoint.health.show-details=never
spring.kafka.bootstrap-servers=${DEV3_KAFKA_BOOTSTRAP_SERVERS}
archive.kafka.topic=${DEV3_MATCH_EVENTS_TOPIC}
archive.kafka.group-id=${DEV3_ARCHIVER_GROUP_ID}
archive.source-id=${DEV3_ARCHIVER_SOURCE_ID}
archive.consumer.enabled=false
spring.kafka.listener.auto-startup=false
