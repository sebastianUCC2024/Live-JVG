spring.application.name=historical-archiver
server.port=${ARCHIVER_PORT:8082}
spring.datasource.url=${ARCHIVER_DB_URL:jdbc:postgresql://localhost:5432/archiver}
spring.datasource.username=${ARCHIVER_DB_USERNAME:archiver}
spring.datasource.password=${ARCHIVER_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
# Migration execution is a separate, explicitly authorized operation.
spring.flyway.enabled=false
spring.flyway.schemas=archiver
spring.flyway.default-schema=archiver
spring.flyway.table=flyway_schema_history
spring.flyway.clean-disabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=false
archive.consumer.enabled=${ARCHIVER_CONSUMER_ENABLED:false}
archive.kafka.topic=${MATCH_EVENTS_TOPIC:match_events}
archive.kafka.group-id=${ARCHIVER_GROUP_ID:historical-archiver}
archive.source-id=${ARCHIVER_SOURCE_ID:local/1}
archive.retry-interval-ms=200
spring.jackson.property-naming-strategy=SNAKE_CASE
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework.kafka.listener=OFF

management.endpoint.health.probes.enabled=true

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,messagingReadiness
